name: seatly-ticketflow

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ticketflow
      POSTGRES_PASSWORD: ticketflow
      POSTGRES_DB: ticketflow
    ports:
      - "5433:5432"          # host 5433 -> container 5432 (avoids clash with local Postgres)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketflow -d ticketflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ticketflow
      RABBITMQ_DEFAULT_PASS: ticketflow
    ports:
      - "5672:5672"          # AMQP
      - "15672:15672"        # management UI: http://localhost:15672
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"          # SMTP
      - "8025:8025"          # web UI: http://localhost:8025

  # Optional: run the API in Docker too (not needed day to day in Phase 0)
  api:
    profiles: ["app"]
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://ticketflow:ticketflow@postgres:5432/ticketflow
      REDIS_URL: redis://redis:6380/0
      RABBITMQ_URL: amqp://ticketflow:ticketflow@rabbitmq:5672//
      SMTP_HOST: mailpit
    ports:
      - "8010:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  rabbitdata:
